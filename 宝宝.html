<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1b0b34" />
<title>我们的友谊纪念日 · 岁岁常相伴</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@200;300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --accent:#9ed6ff;
    --accent2:#c39bff;
    --ink:#fffdf7;
    --muted:#e3d2f0;
    --glass:rgba(255,255,255,.09);
    --glass-line:rgba(255,255,255,.18);
    --badge-grad:linear-gradient(135deg,#9ed6ff,#c39bff);
    --badge-ink:#1a2a4a;
    --overlay1:rgba(140,190,255,.30);
    --overlay2:rgba(195,155,255,.26);
    --moon:#d8e8ff;
    --float:rgba(190,220,255,.78);
  }
  html{height:100%;scroll-behavior:smooth;}
  body{
    min-height:100%;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:#1b0b34;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    letter-spacing:.02em;-webkit-overflow-scrolling:touch;
  }
  .serif{font-family:"Noto Serif SC","Noto Sans SC",serif;}

  /* ===== 背景：梦幻紫蓝浪漫夜空 ===== */
  .bg{
    position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      linear-gradient(180deg,#1b0b34 0%,#2b0f4a 34%,#3c1b5e 62%,#4a2368 88%,#573070 100%);
  }
  .bg .pic{
    position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:.58;filter:saturate(1.15) contrast(1.02) brightness(.86);
    transition:opacity 1.2s ease;
  }
  #bgLandscape{
    background-image:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/NffzbxOfWoN0lIxC2YhcWxLtnvs");
    display:block;
  }
  #bgPortrait{
    background-image:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Sm5gbGr5HoFEbixMKbgc1zSJnPf");
    display:none;
  }
  /* 浪漫极光光晕层 */
  .aurora{
    position:absolute;inset:-22%;z-index:1;pointer-events:none;opacity:.82;
    background:
      radial-gradient(34% 30% at 22% 22%, rgba(140,190,255,.52), transparent 70%),
      radial-gradient(30% 26% at 80% 16%, rgba(170,200,255,.46), transparent 70%),
      radial-gradient(38% 32% at 70% 84%, rgba(190,140,255,.48), transparent 70%),
      radial-gradient(30% 26% at 12% 80%, rgba(120,170,255,.42), transparent 70%),
      radial-gradient(42% 34% at 50% 52%, rgba(160,200,255,.16), transparent 72%);
    animation:auroraMove 28s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes auroraMove{
    0%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(2.2%,-2.4%,0) scale(1.07);}
    100%{transform:translate3d(-2%,1.8%,0) scale(1.03);}
  }
  .bg::after{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(22,8,44,.30),rgba(22,8,44,.46) 45%,rgba(16,6,36,.80)),
      radial-gradient(120% 80% at 50% 118%, rgba(140,180,255,.18), transparent 62%);
  }
  .tint{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.36;mix-blend-mode:screen;
    background:radial-gradient(1200px 800px at 80% 12%,var(--overlay1),transparent 60%),
               radial-gradient(900px 700px at 15% 85%,var(--overlay2),transparent 60%);
    transition:background .8s ease;
  }

  /* 星光 */
  .stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;
    box-shadow:0 0 6px #fff;animation:twinkle linear infinite;}
  @keyframes twinkle{0%,100%{opacity:0;}50%{opacity:.85;}}

  /* 光斑 */
  .bokeh{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .bokeh-dot{
    position:absolute;border-radius:50%;will-change:transform;
    background:radial-gradient(circle, rgba(190,220,255,.42), rgba(180,150,255,.14) 46%, transparent 72%);
    animation:bokehFloat linear infinite;
  }
  @keyframes bokehFloat{
    0%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(26px,-42px,0) scale(1.14);}
    100%{transform:translate3d(0,0,0) scale(1);}
  }

  /* 飘落元素 */
  .floaters{position:fixed;inset:0;z-index:2;pointer-events:none;}
  .fl{position:absolute;top:-48px;color:var(--float);text-shadow:0 0 12px rgba(150,190,255,.6);
    animation:fall linear infinite;opacity:0;will-change:transform,opacity;}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0);opacity:0;}
    8%{opacity:1;}
    100%{transform:translateY(116vh) rotate(340deg);opacity:0;}
  }

  /* 月亮 */
  .moon{
    position:fixed;top:5%;right:7%;width:clamp(86px,13vw,150px);height:clamp(86px,13vw,150px);
    border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 35% 32%,#fffdf2 0%,#e8f2ff 40%,var(--moon) 100%);
    box-shadow:0 0 60px rgba(220,235,255,.6),0 0 120px rgba(170,200,255,.3),
               inset -10px -10px 26px rgba(160,190,240,.5);
    animation:moonBreath 7s ease-in-out infinite;transition:background .8s ease;
  }
  .moon::after{content:"";position:absolute;top:20%;left:24%;width:15px;height:15px;border-radius:50%;
    background:rgba(220,235,255,.42);}
  @keyframes moonBreath{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  /* ===== 星图封面 ===== */
  .cover{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    flex-direction:column;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,#180b37 0%,#2a0f4c 52%,#3c1b60 100%);
    transition:opacity 1.05s ease .1s;will-change:opacity;
  }
  .cover::before{
    content:"";position:absolute;inset:-20%;
    background:
      radial-gradient(34% 30% at 26% 26%, rgba(140,190,255,.34), transparent 70%),
      radial-gradient(30% 26% at 76% 74%, rgba(180,150,255,.32), transparent 70%);
    animation:auroraMove 22s ease-in-out infinite alternate;
  }
  .cover.hide{opacity:0;pointer-events:none;}
  .heartmap{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .hm-heart{
    position:absolute;will-change:transform,opacity;color:rgba(190,215,255,.6);
    transition:transform 1.1s cubic-bezier(.5,0,.2,1),opacity 1s ease;
  }
  .cover .cover-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:0 28px;}
  .gift{
    position:relative;width:104px;height:104px;border-radius:26px;margin-bottom:30px;
    background:linear-gradient(145deg,#7cb8ff,#b388ff);display:flex;align-items:center;justify-content:center;
    font-size:50px;box-shadow:0 22px 54px rgba(120,160,255,.5),0 0 0 9px rgba(255,255,255,.08);
    animation:giftBeat 1.5s ease-in-out infinite;
  }
  .gift::before{content:"";position:absolute;inset:-18px;border-radius:50%;
    border:1px solid rgba(255,255,255,.18);animation:ring 2.6s ease-out infinite;}
  @keyframes giftBeat{0%,100%{transform:scale(1);}28%{transform:scale(1.09);}56%{transform:scale(.96);}}
  @keyframes ring{0%{transform:scale(.75);opacity:.7;}100%{transform:scale(1.45);opacity:0;}}
  .cover-title{font-size:clamp(19px,4.8vw,23px);font-weight:300;letter-spacing:6px;margin-bottom:12px;color:#fff;}
  .cover-sub{font-size:14px;color:rgba(255,255,255,.62);letter-spacing:4px;margin-bottom:42px;}
  .cover-hint{font-size:13px;color:#cfe4ff;letter-spacing:5px;animation:blink 2.2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* ===== 主内容 ===== */
  .main{
    position:relative;z-index:10;min-height:100vh;
    display:flex;align-items:center;align-items:safe center;justify-content:center;
    padding:34px 20px 64px;opacity:0;transform:translateY(36px) scale(.98);
    transition:opacity 1.2s ease .35s,transform 1.2s cubic-bezier(.2,.9,.25,1) .35s;
    will-change:transform,opacity;
  }
  .main.show{opacity:1;transform:translateY(0) scale(1);}
  .card{
    width:100%;max-width:520px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
    border:1px solid var(--glass-line);border-radius:34px;padding:40px 34px 36px;text-align:center;
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 34px 80px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.18),
               0 24px 50px rgba(150,180,255,.12);
  }
  .card::before,.card::after{content:"";position:absolute;border-radius:50%;pointer-events:none;}
  .card::before{top:-70px;left:-60px;width:210px;height:210px;
    background:radial-gradient(circle,var(--overlay1),transparent 70%);}
  .card::after{bottom:-90px;right:-50px;width:230px;height:230px;
    background:radial-gradient(circle,var(--overlay2),transparent 70%);}

  .badge{
    display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;margin-bottom:24px;
    position:relative;z-index:2;background:var(--badge-grad);color:var(--badge-ink);
    font-size:13px;font-weight:600;letter-spacing:3px;
    box-shadow:0 12px 26px rgba(150,180,255,.35);
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--badge-ink);
    display:inline-block;opacity:.6;}

  .names{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    gap:14px;margin-bottom:16px;}
  .names .t{font-size:clamp(18px,4.6vw,22px);letter-spacing:6px;color:#fff;font-weight:400;
    text-shadow:0 0 22px rgba(200,220,255,.45);}
  .names .h{font-size:16px;color:#a9c8ff;animation:heartBeat 1.6s ease-in-out infinite;display:inline-block;}

  .sub{font-size:14px;color:var(--muted);letter-spacing:5px;margin-bottom:12px;
    position:relative;z-index:2;font-weight:300;}
  .days{
    font-size:clamp(78px,20vw,104px);font-weight:200;color:#fff;line-height:1;letter-spacing:-3px;
    margin:10px 0 8px;font-variant-numeric:tabular-nums;
    text-shadow:0 0 34px rgba(200,220,255,.5);position:relative;z-index:2;
  }
  .days-unit{font-size:15px;color:var(--muted);letter-spacing:6px;margin-bottom:24px;
    position:relative;z-index:2;font-weight:300;}

  .time-row{
    display:flex;gap:10px;padding:16px 0;margin-bottom:22px;position:relative;z-index:2;
    border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);
  }
  .time-box{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:11px 4px;}
  .time-num{font-size:clamp(20px,5.2vw,26px);font-weight:300;color:#fff;
    font-variant-numeric:tabular-nums;display:inline-block;}
  .time-num.pop{animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.2);}100%{transform:scale(1);}}
  .time-label{font-size:12px;color:rgba(255,255,255,.6);margin-top:5px;letter-spacing:2px;}

  .milestone{position:relative;z-index:2;font-size:13px;color:var(--accent2);
    letter-spacing:2px;margin-bottom:22px;font-weight:400;line-height:1.7;}

  .poem-head{font-size:12px;color:var(--accent);letter-spacing:5px;margin-bottom:16px;
    position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;}
  .poem-head::before,.poem-head::after{content:"";width:34px;height:1px;
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 60%,transparent),transparent);}

  .poem-card{position:relative;z-index:2;padding:24px 18px 20px;border-radius:20px;margin-bottom:16px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);}
  .poem-card .q{position:absolute;top:6px;left:16px;font-size:42px;line-height:1;
    color:color-mix(in srgb,var(--accent) 40%,transparent);font-family:Georgia,serif;}
  .poem-text{font-size:clamp(19px,5.4vw,24px);font-weight:400;color:#fff;line-height:1.7;
    letter-spacing:.05em;transition:opacity .5s ease,transform .5s ease;}
  .poem-text.swap-out{opacity:0;transform:translateY(12px);}
  .poem-from{margin-top:12px;font-size:13px;color:var(--muted);letter-spacing:3px;
    transition:opacity .5s ease;}
  .poem-from .author{color:var(--accent);}
  .poem-explain{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.16);
    font-size:14px;line-height:1.8;color:rgba(255,255,255,.82);text-align:left;
    transition:opacity .5s ease;}

  .btn{
    position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:13px 30px;
    border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#7cb8ff,#b388ff);
    color:#fff;font-family:inherit;font-size:14px;letter-spacing:3px;border:none;
    box-shadow:0 14px 32px rgba(120,160,255,.4),inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .btn:active{transform:scale(.94);}
  .btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;display:inline-block;transition:transform .6s ease;}
  .btn.spinning .spin{transform:rotate(360deg);}

  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 16px;
    position:relative;z-index:2;}
  .divider .line{width:40px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);}
  .divider .heart{color:#a9c8ff;font-size:15px;animation:heartBeat 1.6s ease-in-out infinite;}
  @keyframes heartBeat{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  .signature{font-size:14px;color:var(--muted);letter-spacing:4px;position:relative;z-index:2;
    line-height:1.9;font-weight:300;}
  .signature b{color:#fff;font-weight:400;}
  .signature .end{color:var(--accent);}

  .next{position:relative;z-index:2;margin-top:18px;font-size:12px;
    color:rgba(255,255,255,.5);letter-spacing:2px;line-height:1.8;}

  @media (max-width:767px){
    #bgLandscape{display:none;}
    #bgPortrait{display:block;}
    .card{padding:32px 22px 28px;border-radius:28px;}
    .moon{top:4%;right:6%;}
  }
  @media (min-width:768px){.main{padding:44px;}}
  @media (max-width:370px){
    .card{padding:28px 18px 24px;}
    .poem-text{font-size:18px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important;}
    .aurora,.bokeh-dot{animation:none!important;}
  }
</style>
</head>
<body>

<div class="bg">
  <div class="pic" id="bgLandscape"></div>
  <div class="pic" id="bgPortrait"></div>
  <div class="aurora"></div>
</div>
<div class="tint" id="tint"></div>
<div class="moon" id="moon"></div>
<div class="stars" id="stars"></div>
<div class="bokeh" id="bokeh"></div>
<div class="floaters" id="floaters"></div>

<!-- 星图封面 -->
<div class="cover" id="cover">
  <div class="heartmap" id="heartmap"></div>
  <div class="cover-inner">
    <div class="gift" id="giftIcon">🎁</div>
    <div class="cover-title" id="coverTitle">你有一份祝福</div>
    <div class="cover-sub" id="coverSub">来自你的挚友</div>
    <div class="cover-hint">点击开启</div>
  </div>
</div>

<!-- 主内容 -->
<div class="main" id="main">
  <div class="card">
    <div class="badge"><span class="dot"></span><span id="badgeText">✨ 友谊长存</span></div>
    <div class="names serif"><span class="t" id="nameA">DYD</span><span class="h">✦</span><span class="t" id="nameB">LZY</span></div>
    <div class="sub" id="subLabel">我们相识已经</div>
    <div class="days serif" id="days">0</div>
    <div class="days-unit" id="daysUnit">天</div>

    <div class="time-row">
      <div class="time-box"><div class="time-num" id="hours">00</div><div class="time-label">小时</div></div>
      <div class="time-box"><div class="time-num" id="minutes">00</div><div class="time-label">分钟</div></div>
      <div class="time-box"><div class="time-num" id="seconds">00</div><div class="time-label">秒</div></div>
    </div>

    <div class="milestone" id="milestone"></div>

    <div class="poem-head">今日寄语</div>
    <div class="poem-card">
      <span class="q">“</span>
      <div class="poem-text serif" id="poemText"></div>
      <div class="poem-from" id="poemFrom"></div>
      <div class="poem-explain" id="poemExplain"></div>
    </div>
    <button class="btn" id="btnSwap"><span class="spin"></span>换一句</button>

    <div class="divider"><span class="line"></span><span class="heart">✦</span><span class="line"></span></div>
    <div class="signature">愿我们 <b>岁岁常相聚</b> · <b>年年共欢笑</b><br><span class="end" id="sigEnd">相遇本身，就是最好的礼物</span></div>
    <div class="next" id="nextInfo"></div>
  </div>
</div>

<script>
/* ============================================================
 * 农历转换（1900-2100）
 * ============================================================ */

function lLeapMonth(y){return lunarInfo[y-1900]&0xf;}
function lLeapDays(y){return lLeapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
function lMonthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function lYearDays(y){var i,s=348;for(i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+lLeapDays(y);}
function solarToLunar(y,m,d){
  var offset=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  var i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i;
  var leap=lLeapMonth(i),isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i==(leap+1)&&!isLeap){--i;isLeap=true;temp=lLeapDays(year);}
    else{temp=lMonthDays(year,i);}
    if(isLeap&&i==(leap+1))isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}
  if(offset<0){offset+=temp;--i;}
  return {lYear:year,lMonth:i,lDay:offset+1,isLeap:isLeap};
}

/* ===== 今天是什么日子 ===== */
function todayInfo(now){
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const lunar=solarToLunar(y,m,d);
  const fest=FESTS.find(f=>f.t==='solar'&&f.m===m&&f.d===d)
          ||FESTS.find(f=>f.t==='lunar'&&f.lm===lunar.lMonth&&f.ld===lunar.lDay&&!lunar.isLeap);
  const todayZero=new Date(y,m-1,d);
  const diff=Math.floor((todayZero-START)/86400000);
  const isAnniv=(m===ANNIV_M&&d===ANNIV_D);
  let mile=null;
  if(diff>0&&MILES.indexOf(diff)>-1)mile=diff;
  return {fest,diff,anniv:isAnniv,mile,dateStr:y+'年'+m+'月'+d+'日',weekday:'日一二三四五六'[now.getDay()],lunar};
}

/* ===== 距离下一个纪念日 / 节日 ===== */
function findNext(now){
  const todayZero=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.floor((todayZero-START)/86400000);

  let mileNext=null;
  if(diff>=0){
    for(const n of MILES){if(n>diff){mileNext=n;break;}}
  }
  const mileDate=mileNext!==null?new Date(START.getTime()+mileNext*86400000):null;

  let festNext=null;
  for(let i=1;i<=400;i++){
    const dt=new Date(todayZero.getTime()+i*86400000);
    const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
    const lunar=solarToLunar(y,m,d);
    const f=FESTS.find(x=>(x.t==='solar'&&x.m===m&&x.d===d)||
                          (x.t==='lunar'&&x.lm===lunar.lMonth&&x.ld===lunar.lDay&&!lunar.isLeap));
    if(f){festNext={name:f.name,emoji:f.emoji,date:dt};break;}
    if(m===ANNIV_M&&d===ANNIV_D){festNext={name:'相识周年纪念日',emoji:'🎊',date:dt};break;}
  }

  const mileLeft=mileDate!==null?Math.round((mileDate-todayZero)/86400000):null;
  const festLeft=festNext?Math.round((festNext.date-todayZero)/86400000):null;

  if(mileLeft!==null&&festLeft!==null){
    return mileLeft<=festLeft
      ? {text:'距离 相识第 '+mileNext+' 天 还有 '+mileLeft+' 天'}
      : {text:'距离 '+festNext.emoji+' '+festNext.name+' 还有 '+festLeft+' 天'};
  }
  if(mileLeft!==null)return {text:'距离 相识第 '+mileNext+' 天 还有 '+mileLeft+' 天'};
  if(festLeft!==null)return {text:'距离 '+festNext.emoji+' '+festNext.name+' 还有 '+festLeft+' 天'};
  return null;
}

  }

/* ===== 数字滚动 ===== */
function rollNumber(el,target,dur){
  const t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);
    if(p<1)requestAnimationFrame(step);else el.textContent=target;
  }
  requestAnimationFrame(step);
}

/* ===== 计时（rAF 平滑 + 跨天自动刷新） ===== */
let lastSec=-1, lastDayKey='', daysInited=false;
function tick(){
  const now=new Date();
  const dayKey=now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate();
  if(dayKey!==lastDayKey){
    lastDayKey=dayKey;
    if(daysInited) render();
  }

  const diff=Math.max(0,Date.now()-START.getTime());
  const daysVal=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const mi=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);

  const daysEl=$('days');
  if(!daysInited){
    daysInited=true;
    rollNumber(daysEl,daysVal,1400);
  }else if(daysEl.textContent!==String(daysVal)){
    daysEl.textContent=daysVal;
  }

  $('hours').textContent=String(h).padStart(2,'0');
  $('minutes').textContent=String(mi).padStart(2,'0');
  if(s!==lastSec){
    const el=$('seconds');
    el.textContent=String(s).padStart(2,'0');
    el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    lastSec=s;
  }
  requestAnimationFrame(tick);
}

  {text:"故人西辞黄鹤楼，烟花三月下扬州",from:"黄鹤楼送孟浩然之广陵",author:"李白",explain:"老朋友在黄鹤楼与我告别，在烟花三月顺流而下前往扬州。送别友人的美好画面。"},
  {text:"孤帆远影碧空尽，唯见长江天际流",from:"黄鹤楼送孟浩然之广陵",author:"李白",explain:"孤帆渐渐消失在碧空尽头，只见长江浩浩荡荡流向天边。目送友人远去的依依不舍。"},
  {text:"相知无远近，万里尚为邻",from:"送韦城李少府",author:"张九龄",explain:"真正的相知不在乎距离远近，即使相隔万里，也像邻居般亲近。"},
  {text:"结交在相知，骨肉何必亲",from:"箜篌谣",author:"汉乐府",explain:"交朋友贵在相互知心，哪怕不是骨肉至亲，也能亲密无间。"},
  {text:"山河不足重，重在遇知己",from:"壮士行",author:"鲍溶",explain:"山河的壮美都不重要，重要的是遇到一个真正懂自己的知己。"},
  {text:"人生贵相知，何必金与钱",from:"赠友人三首",author:"李白",explain:"人生最宝贵的是彼此相知，何必看重金钱与财富。"},
  {text:"君子之交淡如水，小人之交甘若醴",from:"庄子·山木",author:"庄子",explain:"君子之间的交往清淡如水却长久，小人之间的交往甜如美酒却易断。真正的友情淡而持久。"},
  {text:"有朋自远方来，不亦乐乎",from:"论语·学而",author:"孔子",explain:"有志同道合的朋友从远方来，不也是很快乐的事情吗？朋友相见，其乐融融。"},
  {text:"投我以木桃，报之以琼瑶",from:"诗经·卫风·木瓜",author:"佚名",explain:"你赠我木桃，我回赠你美玉。朋友之间礼尚往来，情谊在往来中更深。"},
  {text:"岂曰无衣？与子同袍",from:"诗经·秦风·无衣",author:"佚名",explain:"谁说没有衣裳？我与你同穿一件战袍。患难与共、同甘共苦的深情。"},
  {text:"二人同心，其利断金",from:"周易·系辞上",author:"佚名",explain:"两个人同心协力，力量足以切断金属。朋友同心，无坚不摧。"},
  {text:"嘤其鸣矣，求其友声",from:"诗经·小雅·伐木",author:"佚名",explain:"鸟儿嘤嘤鸣叫，是为了寻找同伴的声音。人亦如此，渴望知音。"},
  {text:"我寄愁心与明月，随君直到夜郎西",from:"闻王昌龄左迁龙标遥有此寄",author:"李白",explain:"我把牵挂托付给明月，让它随你一直到夜郎以西。以月寄情，牵挂远方的朋友。"},
  {text:"浮云游子意，落日故人情",from:"送友人",author:"李白",explain:"浮云飘忽如游子的心意，落日依依如故人的深情。送别时的万千思绪。"},
  {text:"洛阳亲友如相问，一片冰心在玉壶",from:"芙蓉楼送辛渐",author:"王昌龄",explain:"洛阳的亲友若问起我，就说我的心依然像玉壶中的冰一样纯洁。托友传语，表明心志。"},
  {text:"青山一道同云雨，明月何曾是两乡",from:"送柴侍御",author:"王昌龄",explain:"你我同在一片青山之下，共沐云雨，明月又何曾照的是两个地方？虽别犹同。"},
  {text:"桃李春风一杯酒，江湖夜雨十年灯",from:"寄黄几复",author:"黄庭坚",explain:"当年桃李春风中一起饮酒，如今各自在江湖夜雨里对灯十年。回忆友情，感慨岁月。"},
  {text:"正是江南好风景，落花时节又逢君",from:"江南逢李龟年",author:"杜甫",explain:"正是江南风景最美好的时候，在落花时节又与你重逢。久别重逢的欣喜。"},
  {text:"人生如逆旅，我亦是行人",from:"临江仙·送钱穆父",author:"苏轼",explain:"人生就像一家旅店，我也只是个过路的行人。送别友人时对人生的旷达感悟。"},
  {text:"一壶浊酒喜相逢，古今多少事，都付笑谈中",from:"临江仙",author:"杨慎",explain:"一壶浊酒为相逢而欢喜，古往今来多少事，都在笑谈中消散。老友相逢的豪迈。"},
  {text:"但愿人长久，千里共婵娟",from:"水调歌头",author:"苏轼",explain:"只愿人能长长久久，即使相隔千里，也能共赏这一轮明月。对朋友最美好的祝愿。"},
  {text:"故人入我梦，明我长相忆",from:"梦李白二首",author:"杜甫",explain:"老朋友走进我的梦里，知道我一直在深深地思念着他。思念入梦，情谊深切。"},
  {text:"何时一樽酒，重与细论文",from:"春日忆李白",author:"杜甫",explain:"什么时候能再一起举杯，细细品评文章呢？对与知己重逢的期盼。"},
  {text:"渭北春天树，江东日暮云",from:"春日忆李白",author:"杜甫",explain:"我在渭北望着春天的树，你在江东看着日暮的云——两地相隔，彼此思念。"},
  {text:"同心而离居，忧伤以终老",from:"涉江采芙蓉",author:"佚名",explain:"心意相同却分隔两地，只能忧伤地终老。距离带来的思念之苦。"},
  {text:"青青子衿，悠悠我心",from:"诗经·郑风·子衿",author:"佚名",explain:"你那青青的衣领，牵动着我的心。对友人的挂念，一见如故。"},
  {text:"岁寒，然后知松柏之后凋也",from:"论语·子罕",author:"孔子",explain:"到了寒冷的季节，才知道松柏是最后凋零的。患难之中，方见真情。"},
  {text:"路遥知马力，日久见人心",from:"增广贤文",author:"佚名",explain:"路途遥远才能知道马的力气，相处久了才能看清一个人的心。时间会检验友情。"},
  {text:"愿岁并谢，与长友兮",from:"九章·橘颂",author:"屈原",explain:"愿与岁月一同更替，与你长久为友。对友谊长久的祝愿。"},
  {text:"钟期既遇，奏流水以何惭",from:"滕王阁序",author:"王勃",explain:"既然遇到了钟子期这样的知音，弹奏流水之曲又有什么可羞愧的呢？得遇知音的喜悦。"},
  {text:"一生大笑能几回，斗酒相逢须醉倒",from:"凉州馆中与诸判官夜集",author:"岑参",explain:"一生中能开怀大笑几回？有酒相逢就该一醉方休。与朋友相聚的豪情。"},
  {text:"数声风笛离亭晚，君向潇湘我向秦",from:"淮上与友人别",author:"郑谷",explain:"离亭中晚风送来几声笛音，你要去潇湘，我要去秦地。分道扬镳的惆怅。"},
  {text:"与君初相识，犹如故人归",from:"题鹤林寺僧舍",author:"佚名",explain:"第一次与你相识，却像是故人归来一般亲切。一见如故的友情。"},
  {text:"人生得一知己足矣，斯世当以同怀视之",from:"赠瞿秋白",author:"鲁迅",explain:"人生能有一个真正的知己就足够了，这一生都该以知心相待。"},
  {text:"结交贵知心，何须论金玉",from:"古谚",author:"佚名",explain:"交朋友最珍贵的是彼此知心，不必计较金钱与地位。"},
  {text:"高山仰止，景行行止",from:"诗经·小雅·车舝",author:"佚名",explain:"仰望高山，效法大德。对友人品格的敬仰，愿与之同行。"}
];
/* ===POEMS-END=== */

const dayIdx=Math.floor(Date.now()/86400000)%POEMS.length;
let curIndex=dayIdx;

function showPoem(i,animate){
  const t=$('poemText'),f=$('poemFrom'),e=$('poemExplain');
  const set=()=>{
    t.textContent=POEMS[i].text;
    f.innerHTML='—— <span class="author">'+POEMS[i].author+'</span>《'+POEMS[i].from+'》';
    e.textContent='释义：'+POEMS[i].explain;
  };
  if(animate){
    t.classList.add('swap-out');
    f.style.opacity=0;e.style.opacity=0;
    setTimeout(()=>{
      set();
      t.classList.remove('swap-out');
      f.style.opacity=1;e.style.opacity=1;
    },260);
  } else set();
}
showPoem(dayIdx,false);

$('btnSwap').addEventListener('click',function(){
  let n=Math.floor(Math.random()*POEMS.length);
  let guard=0;
  while(n===curIndex&&guard++<20)n=Math.floor(Math.random()*POEMS.length);
  curIndex=n;
  const b=this;b.classList.add('spinning');
  setTimeout(()=>b.classList.remove('spinning'),620);
  showPoem(n,true);
});

/* ===== 星图封面 ===== */
(function(){
  const map=$('heartmap');
  const cover=$('cover');
  const W=window.innerWidth,H=window.innerHeight;
  const cx=W/2,cy=H/2,base=Math.min(W,H)*0.34;
  const marks=['✦','✧','★','☆','✨'];
  const N=Math.min(150,Math.max(50,Math.floor(Math.min(W,H)/11)));
  const frag=document.createDocumentFragment();
  for(let i=0;i<N;i++){
    const t=Math.random()*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const spread=0.14+Math.random()*0.56;
    const el=document.createElement('div');
    el.className='hm-heart';
    el.textContent=marks[Math.floor(Math.random()*marks.length)];
    const size=Math.random()*12+9;
    el.style.left=(cx+x*base*spread)+'px';
    el.style.top=(cy-y*base*spread)+'px';
    el.style.fontSize=size+'px';
    el.style.transform='translate(-50%,-50%)';
    el.style.opacity=String(Math.random()*.45+.25);
    frag.appendChild(el);
  }
  map.appendChild(frag);

  let opened=false;
  const open=()=>{
    if(opened)return;opened=true;
    map.querySelectorAll('.hm-heart').forEach(el=>{
      const dx=(Math.random()*2-1),dy=(Math.random()*2-1),dist=Math.random()*0.6+0.25;
      el.style.transform='translate(-50%,-50%) translate('+(dx*base*2.2*dist)+'px,'+
        (dy*base*2.2*dist)+'px) scale('+(Math.random()*1.5+.5)+')';
      el.style.opacity=0;
    });
    cover.classList.add('hide');
    $('main').classList.add('show');
    const g=$('giftIcon');
    g.style.transition='transform 1s ease,opacity .8s ease';
    g.style.transform='scale(2.6)';g.style.opacity=0;
    setTimeout(()=>{cover.style.display='none';},1300);
  };
  cover.addEventListener('click',open);
  cover.addEventListener('touchstart',open,{passive:true});
})();

/* ===== 星光 ===== */
(function(){
  const s=$('stars');
  const frag=document.createDocumentFragment();
  const n=window.innerWidth<600?38:60;
  for(let i=0;i<n;i++){
    const e=document.createElement('div');e.className='star';
    e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';
    e.style.animationDuration=(Math.random()*3+2)+'s';
    e.style.animationDelay=(Math.random()*3)+'s';
    e.style.transform='scale('+(Math.random()*1.2+.4)+')';
    frag.appendChild(e);
  }
  s.appendChild(frag);
})();

/* ===== 光斑 ===== */
(function(){
  const box=$('bokeh');
  const n=window.innerWidth<600?9:15;
  const frag=document.createDocumentFragment();
  for(let i=0;i<n;i++){
    const b=document.createElement('div');
    b.className='bokeh-dot';
    const size=Math.random()*150+80;
    b.style.width=size+'px';b.style.height=size+'px';
    b.style.left=(Math.random()*120-10)+'%';
    b.style.top=(Math.random()*120-10)+'%';
    b.style.animationDuration=(Math.random()*22+20)+'s';
    b.style.animationDelay=(-Math.random()*22)+'s';
    b.style.opacity=String(Math.random()*.35+.12);
    frag.appendChild(b);
  }
  box.appendChild(frag);
})();

/* ===== 飘落元素 ===== */
let flTimer=null;
function rebuildFloaters(themeKey){
  if(flTimer){clearInterval(flTimer);flTimer=null;}
  const box=$('floaters');
  box.innerHTML='';
  const marks=(THEMES[themeKey]||THEMES.normal).float;
  const MAX=18;
  const spawn=()=>{
    if(box.children.length>=MAX)box.firstElementChild&&box.firstElementChild.remove();
    const e=document.createElement('div');e.className='fl';
    e.textContent=marks[Math.floor(Math.random()*marks.length)];
    e.style.left=Math.random()*100+'%';
    e.style.fontSize=(Math.random()*15+11)+'px';
    e.style.animationDuration=(Math.random()*9+9)+'s';
    e.style.animationDelay=(Math.random()*5)+'s';
    e.style.opacity=(Math.random()*.4+.35);
    box.appendChild(e);
    setTimeout(()=>{e.parentNode&&e.remove();},22000);
  };
  for(let i=0;i<12;i++)spawn();
  flTimer=setInterval(spawn,460);
}

/* ===== 启动 ===== */
render();
tick();
</script>
