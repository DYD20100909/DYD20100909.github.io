<style>

  }

  body{

    color:var(--ink);background:#0b1233;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:.02em;
  }
  .serif{font-family:"Noto Serif SC","Noto Sans SC",serif;}

  /* ===== 背景 ===== */

  .bg .pic{position:absolute;inset:0;background-size:cover;background-position:center;}
  #bgLandscape{background-image:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/NffzbxOfWoN0lIxC2YhcWxLtnvs");display:block;}

  .bg::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,16,48,.28),rgba(10,16,48,.5) 45%,rgba(8,12,40,.8));}
  .tint{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:screen;background:radial-gradient(1200px 800px at 80% 12%,var(--overlay1),transparent 60%),radial-gradient(900px 700px at 15% 85%,var(--overlay2),transparent 60%);transition:background .8s ease;}

  .stars{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .floaters{position:fixed;inset:0;z-index:2;pointer-events:none;}

  .card::after{bottom:-90px;right:-50px;width:230px;height:230px;background:radial-gradient(circle,var(--overlay2),transparent 70%);}

  .sub{font-size:14px;color:var(--muted);letter-spacing:5px;margin-bottom:12px;position:relative;z-index:2;font-weight:300;}
  .days{font-size:clamp(78px,20vw,104px);font-weight:200;color:#fff;line-height:1;letter-spacing:-3px;margin:10px 0 8px;

  .days-unit{font-size:15px;color:var(--muted);letter-spacing:6px;margin-bottom:24px;position:relative;z-index:2;font-weight:300;}

  .signature b{color:#fff;font-weight:400;}

  .next{position:relative;z-index:2;margin-top:18px;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:2px;}

  @media (max-width:767px){

    #bgPortrait{display:block;}

  @media (min-width:768px){.main{padding:44px;}}
  @media (max-width:370px){.card{padding:28px 18px 24px;}.poem-text{font-size:18px;}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;}}
</style>
</head>

function lLeapDays(y){return lLeapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
function lMonthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function lYearDays(y){var i,s=348;for(i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+lLeapDays(y);}
function solarToLunar(y,m,d){
  var offset=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  var i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var year=i;
  var leap=lLeapMonth(i),isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i==(leap+1)&&!isLeap){--i;isLeap=true;temp=lLeapDays(year);}
    else{temp=lMonthDays(year,i);}
    if(isLeap&&i==(leap+1))isLeap=false;
    offset-=temp;
  }
  if(offset==0&&leap>0&&i==leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}
  if(offset<0){offset+=temp;--i;}
  var month=i;var day=offset+1;
  return {lYear:year,lMonth:month,lDay:day,isLeap:isLeap};

/* ===== 今天是什么日子 ===== */
function todayInfo(now){
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const lunar=solarToLunar(y,m,d);
  let fest=FESTS.find(f=>f.t==='solar'&&f.m===m&&f.d===d)
      ||FESTS.find(f=>f.t==='lunar'&&f.lm===lunar.lMonth&&f.ld===lunar.lDay);
  const diff=Math.floor((new Date(y,m-1,d)-START)/86400000);
  const isAnniv=(m===8&&d===2);
  let mile=null;
  if(diff>0){[100,200,300,365,400,500,520,600,700,730,800,900,1000,1500,2000].forEach(n=>{if(diff===n)mile=n;});}
  const dateStr=y+'年'+m+'月'+d+'日';
  if(isAnniv) return {fest:null,anniv:true,mile:null,diff,dateStr,lunar};
  if(mile) return {fest:null,anniv:false,mile,diff,dateStr,lunar};
  if(fest) return {fest,diff,anniv:false,mile:null,dateStr,lunar};
  return {fest:null,diff,anniv:false,mile:null,dateStr,lunar};
}

/* ===== 距离下一个纪念日 / 节日倒计时 ===== */
const MILES=[100,200,300,365,400,500,520,600,700,730,800,900,1000,1500,2000];
function findNext(now){
  const diff=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-START)/86400000);
  let mileNext=null;
  for(const n of MILES){if(n>diff){mileNext=n;break;}}
  const mileDate=mileNext?new Date(START.getTime()+mileNext*86400000):null;
  let festNext=null;
  for(let i=1;i<=365;i++){
    const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
    const lunar=solarToLunar(y,m,d);
    const f=FESTS.find(x=>(x.t==='solar'&&x.m===m&&x.d===d)||(x.t==='lunar'&&x.lm===lunar.lMonth&&x.ld===lunar.lDay));
    if(f){festNext={name:f.name,emoji:f.emoji,date:dt};break;}
    if(m===8&&d===2){festNext={name:'相识的周年纪念日',emoji:'🎉',date:dt};break;}
  }
  if(mileNext&&festNext){
    const md=Math.round((mileDate-now)/86400000);
    return md<=Math.round((festNext.date-now)/86400000)
      ?{text:'距离 相识第'+mileNext+'天 还有 '+Math.max(md,1)+' 天'}
      :{text:'距离 '+festNext.emoji+' '+festNext.name+' 还有 '+Math.round((festNext.date-now)/86400000)+' 天'};
  }
  if(mileNext){const md=Math.round((mileDate-now)/86400000);return{text:'距离 相识第'+mileNext+'天 还有 '+Math.max(md,1)+' 天'};}
  if(festNext){return{text:'距离 '+festNext.emoji+' '+festNext.name+' 还有 '+Math.round((festNext.date-now)/86400000)+' 天'};}
  return null;
}

/* ===== 数字滚动 ===== */
function rollNumber(el,target,dur){
  const t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);
    if(p<1)requestAnimationFrame(step);else el.textContent=target;
  }
  requestAnimationFrame(step);
}

/* ===== 计时（rAF 平滑） ===== */
let lastSec=-1;
function tick(){
  const diff=Date.now()-START;
  const days=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const mi=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  $('hours').textContent=String(h).padStart(2,'0');
  $('minutes').textContent=String(mi).padStart(2,'0');
  if(s!==lastSec){
    const el=$('seconds');el.textContent=String(s).padStart(2,'0');
    el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    lastSec=s;
  }
  requestAnimationFrame(tick);
}

const dayIdx=Math.floor(Date.now()/86400000)%POEMS.length;

function showPoem(i,animate){
  const t=$('poemText'),f=$('poemFrom'),e=$('poemExplain');

    setTimeout(()=>{set();t.classList.remove('swap-out');t.classList.add('swap-in');f.style.opacity=1;e.style.opacity=1;setTimeout(()=>t.classList.remove('swap-in'),500);},260);
  }else set();
}

});

/* ===== 星星拼图封面 ===== */
(function(){
  const map=$('heartmap');
  const W=window.innerWidth,H=window.innerHeight;
  const cx=W/2,cy=H/2,base=Math.min(W,H)*0.34;
  const marks=['⭐','✨','💫','🌟'];
  const N=Math.floor(Math.min(W,H)/14); // 密度自适应
  for(let i=0;i<N;i++){
    const t=Math.random()*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const spread=0.12+(Math.random()*0.55); // 内部填充+边缘
    const el=document.createElement('div');
    el.className='hm-heart';
    el.textContent=marks[Math.floor(Math.random()*marks.length)];
    const size=Math.random()*12+9;
    el.style.left=(cx+x*base*spread)+'px';
    el.style.top=(cy-y*base*spread)+'px';
    el.style.fontSize=size+'px';
    el.style.transform='translate(-50%,-50%)';
    el.style.opacity=String(Math.random()*.45+.25);
    el.setAttribute('data-a','0');
    el.style.transformOrigin='center';
    map.appendChild(el);
  }
  // 点击散开
  $('cover').addEventListener('click',()=>{
    const hearts=map.querySelectorAll('.hm-heart');
    hearts.forEach((el)=>{
      const dx=(Math.random()*2-1),dy=(Math.random()*2-1),dist=Math.random()*0.6+0.25;
      el.style.transition='transform 1s cubic-bezier(.5,0,.2,1),opacity .95s ease';
      el.style.transform='translate(-50%,-50%) translate('+(dx*base*2.2*dist)+'px,'+(dy*base*2.2*dist)+'px) scale('+(Math.random()*1.5+.5)+')';
      el.style.opacity=0;
    });
    $('cover').classList.add('hide');
    $('main').classList.add('show');
    // 图标放大淡出
    const g=$('giftIcon');
    g.style.transition='transform 1s ease,opacity .8s ease';g.style.transform='scale(2.6)';g.style.opacity=0;
  });
})();

/* ===== 星光 ===== */
(function(){
  const s=$('stars');
  for(let i=0;i<56;i++){
    const e=document.createElement('div');e.className='star';
    e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';
    e.style.animationDuration=(Math.random()*3+2)+'s';e.style.animationDelay=Math.random()*3+'s';
    e.style.transform='scale('+(Math.random()*1.2+.4)+')';s.appendChild(e);
  }
})();

/* ===== 飘落元素（主题化、限量保流畅） ===== */
let flTimer=null;
function rebuildFloaters(themeKey){
  if(flTimer)clearInterval(flTimer);
  $('floaters').innerHTML='';
  const marks=THEMES[themeKey].float;
  const spawn=()=>{
    const box=$('floaters');
    const e=document.createElement('div');e.className='fl';
    e.textContent=marks[Math.floor(Math.random()*marks.length)];
    e.style.left=Math.random()*100+'%';
    e.style.fontSize=(Math.random()*15+11)+'px';
    e.style.animationDuration=(Math.random()*9+9)+'s';
    e.style.animationDelay=(Math.random()*5)+'s';
    e.style.opacity=(Math.random()*.4+.35);
    box.appendChild(e);
    setTimeout(()=>e.remove(),20000);
    if(box.children.length>22)e.remove();
  };
  for(let i=0;i<14;i++)spawn();
  flTimer=setInterval(spawn,420);
}

/* ===== 启动 ===== */
const info=render();
rollNumber($('days'),Math.max(info.diff,0),1400);
tick();
</script>
</body>
